name: Spacebase
description: >-
  Spacebase is an online marketplace for booking meeting rooms, event venues,
  and flexible workspaces, connecting businesses and event planners with more
  than 18,000 unique spaces across 4,000+ venues in 12 countries and 550+
  destinations. The platform offers self-service online booking with transparent
  pricing, instant confirmation, add-on extras such as WiFi and catering, and a
  Spacebase booking guarantee, alongside consultant support for complex bookings
  and business accounts with negotiated rates and monthly invoicing. Spacebase
  is a portfolio company of Point Nine. This profile was enriched by the API
  Evangelist pipeline; the company operates a consumer/business booking
  marketplace and publishes no public developer API surface.
